# Block Storage Node - Cinder Volume 설정
# LVM 백엔드를 사용하여 실제 블록 스토리지 볼륨을 생성하고 iSCSI로 제공

[DEFAULT]
transport_url = rabbit://openstack:openstack@10.0.0.10
auth_strategy = keystone
my_ip = 10.0.0.30

# LVM 백엔드 활성화
enabled_backends = lvm
glance_api_servers = http://10.0.0.10:9292

[database]
connection = mysql+pymysql://cinder:cinder@10.0.0.10/cinder

[keystone_authtoken]
www_authenticate_uri = http://10.0.0.10:5000
auth_url = http://10.0.0.10:5000
memcached_servers = 10.0.0.10:11211
auth_type = password
project_domain_name = default
user_domain_name = default
project_name = service
username = cinder
password = cinder

[lvm]
# LVM 볼륨 그룹: pvcreate /dev/vdb → vgcreate cinder-volumes /dev/vdb
volume_driver = cinder.volume.drivers.lvm.LVMVolumeDriver
volume_group = cinder-volumes
target_protocol = iscsi
target_helper = tgtadm

[oslo_concurrency]
lock_path = /var/lib/cinder/tmp
