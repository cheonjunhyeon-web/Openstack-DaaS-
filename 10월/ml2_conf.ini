# Controller Node - ML2 플러그인 설정
# 트러블슈팅 핵심: mechanism_drivers를 openvswitch 하나로만 지정해야 함
# linuxbridge와 openvswitch 동시 활성화 시 패킷 라우팅 충돌 발생

[ml2]
type_drivers = flat,vlan,vxlan
tenant_network_types = vxlan

# 핵심: openvswitch 단독 지정 (linuxbridge 혼용 불가)
mechanism_drivers = openvswitch,l2population
extension_drivers = port_security

[ml2_type_flat]
flat_networks = provider

[ml2_type_vxlan]
vni_ranges = 1:1000

[securitygroup]
enable_security_group = true
firewall_driver = openvswitch
