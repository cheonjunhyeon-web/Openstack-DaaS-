# Controller Node - Nova 설정
# VM 인스턴스의 생성 / 스케줄링 / 종료 등 전체 수명 주기 관리
# Controller에는 nova-api / nova-scheduler / nova-conductor / nova-novncproxy 설치

[DEFAULT]
# 관리망 IP
my_ip = 10.0.0.10

# 인증 방식
auth_strategy = keystone

# Glance 이미지 서버 주소
[glance]
api_servers = http://10.0.0.10:9292

# RabbitMQ 메시지 큐 연결
# 서비스 간 비동기 작업 지시 전달에 사용
[DEFAULT]
transport_url = rabbit://openstack:openstack@10.0.0.10:5672/

[api_database]
connection = mysql+pymysql://nova:nova@10.0.0.10/nova_api

[database]
connection = mysql+pymysql://nova:nova@10.0.0.10/nova

[keystone_authtoken]
www_authenticate_uri = http://10.0.0.10:5000/
auth_url = http://10.0.0.10:5000/v3
memcached_servers = 10.0.0.10:11211
auth_type = password
project_domain_name = Default
user_domain_name = Default
project_name = service
username = nova
password = nova

[placement]
region_name = RegionOne
project_domain_name = Default
project_name = service
auth_type = password
user_domain_name = Default
auth_url = http://10.0.0.10:5000/v3
username = placement
password = placement

[vnc]
# VNC 콘솔 접속 설정
enabled = true
server_listen = $my_ip
server_proxyclient_address = $my_ip
novncproxy_host = 0.0.0.0
novncproxy_port = 6080
novncproxy_base_url = http://192.168.0.10:6080/vnc_auto.html

[oslo_concurrency]
lock_path = /var/lib/nova/tmp
