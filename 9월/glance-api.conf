# Controller Node - Glance 설정
# VM 이미지 저장 및 관리 서비스
# Nova가 인스턴스 생성 시 이 서비스에서 부팅 이미지를 가져감

[database]
connection = mysql+pymysql://glance:glance@10.0.0.10/glance

[DEFAULT]
# 이미지 저장 백엔드: 로컬 파일시스템(fs) 사용
enabled_backends = fs:file
default_backend = fs

[keystone_authtoken]
# Keystone 인증 연동
www_authenticate_uri = http://10.0.0.10:5000
auth_url = http://10.0.0.10:5000
memcached_servers = 10.0.0.10:11211
auth_type = password
project_domain_name = Default
user_domain_name = Default
project_name = service
username = glance
password = glance

[paste_deploy]
flavor = keystone
